# Incluído em TODO location que tenha um add_header próprio.
#
# Não é redundância: no nginx, um `add_header` dentro de um `location` descarta
# todos os add_header herdados do bloco `server`. Verificado — sem este include,
# `GET /` não devolvia nenhum cabeçalho de segurança, porque o try_files cai em
# `location = /index.html`, que tem add_header de cache e por isso zerava a
# herança.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Robots-Tag "noindex, nofollow" always;
