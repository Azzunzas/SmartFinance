server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # É o extrato completo de uma vida financeira: nada de indexação, nada de
    # embed em site de terceiro. Repetido em cada location com add_header
    # próprio — ver o comentário em security-headers.conf.
    include /etc/nginx/conf.d/security-headers.conf;

    # O front chama /api/... com withCredentials; o proxy mantém tudo na mesma
    # origem, então o cookie de sessão (SameSite=strict) continua sendo enviado.
    # Um domínio separado pra API quebraria isso.
    location /api/ {
        proxy_pass http://smartfinance-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/sync/run devolve 202 na hora, mas o sync roda em background
        # no mesmo processo. Timeout curto aqui derrubaria a conexão à toa.
        proxy_read_timeout 120s;
    }

    # Rotas do Angular são client-side: qualquer caminho desconhecido devolve o
    # index.html e o router resolve. Sem isso, F5 em /transactions dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Angular versiona os assets no nome do arquivo (chunk-BNdrO7kV.js), então
    # cache longo é seguro: nome novo a cada build.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
