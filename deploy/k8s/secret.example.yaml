# Template — NÃO editar com valores reais e commitar.
# Copie pra deploy/k8s/secret.yaml (já está no .gitignore), preencha, e aplique com:
#   kubectl apply -f deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: smartfinance-secrets
type: Opaque
stringData:
  PLUGGY_CLIENT_ID: "troque-por-um-clientId-real"
  PLUGGY_CLIENT_SECRET: "troque-por-um-clientSecret-real"
  # Um UUID por conexão bancária (decisão de 2026-08-20: um CronJob por
  # conexão em vez de um job só iterando uma lista — ver sync-cronjob.yaml).
  # Adicionar um banco novo é só adicionar uma chave aqui + um bloco de
  # CronJob lá, sem mexer em jobs/sync.
  PLUGGY_ITEM_ID_PICPAY: "troque-pelo-item_id-real"
  PLUGGY_ITEM_ID_NUBANK: "troque-pelo-item_id-real"
  PLUGGY_ITEM_ID_SANTANDER: "troque-pelo-item_id-real"
  # O Postgres fica FORA do cluster (decisão de 2026-08-23): é o extrato
  # completo de uma vida financeira, e mantê-lo fora do ciclo de vida do
  # cluster faz backup e recuperação não dependerem de nenhum manifesto.
  #
  # Consequência prática: `localhost` aqui aponta pro PRÓPRIO POD, não pro seu
  # micro. Use o IP do nó (em k3s local, o IP da máquina na LAN ou 10.43.0.1)
  # e garanta que o Postgres escute nele — o container de hoje já publica em
  # 0.0.0.0:5432.
  DATABASE_URL: "postgresql+psycopg://usuario:senha@IP-DO-NO:5432/smartfinance"

  # Secure=true exige HTTPS pro navegador devolver o cookie de sessão. Com o
  # Ingress em TLS, deixe true. Sem TLS (k3s local em http://), tem que ser
  # "false", senão o login "funciona" mas nenhuma request seguinte autentica.
  COOKIE_SECURE: "true"
