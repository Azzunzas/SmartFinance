<div class="modal-backdrop" (click)="cancelled.emit()">
  <section
    class="classification-modal"
    appModal
    role="dialog"
    aria-modal="true"
    aria-labelledby="bulk-classification-title"
    (dismissed)="cancelled.emit()"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <p class="eyebrow">Classificação em lote</p>
        <h2 id="bulk-classification-title">
          {{ transactionIds().length }} transações selecionadas
        </h2>
      </div>
      <button type="button" class="modal-close" aria-label="Fechar" (click)="cancelled.emit()">
        ×
      </button>
    </header>

    <p class="bulk-hint">Campos em “Não alterar” mantêm o valor atual de cada transação.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Categoria
        <select formControlName="category">
          <option value="unchanged">Não alterar</option>
          <option value="automatic">Voltar ao automático</option>
          <option value="none">Remover categoria</option>
          @for (category of categories(); track category.id) {
            @if (category.name !== 'Sem categoria') {
              <option [value]="category.id">{{ category.name }}</option>
            }
          }
        </select>
      </label>

      <label>
        Transferência entre contas próprias
        <select formControlName="is_internal_transfer">
          <option value="unchanged">Não alterar</option>
          <option value="automatic">Voltar ao automático</option>
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </label>

      <label>
        Pagamento de fatura
        <select formControlName="is_card_payment">
          <option value="unchanged">Não alterar</option>
          <option value="automatic">Voltar ao automático</option>
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </label>

      <label>
        Excluir das análises
        <select formControlName="exclude_from_analysis">
          <option value="unchanged">Não alterar</option>
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </label>

      <label class="checkbox-label note-toggle">
        <input type="checkbox" formControlName="change_note" />
        Alterar a nota destas transações
      </label>
      @if (form.controls.change_note.value) {
        <label>
          Nota — deixe vazia para remover
          <textarea rows="3" formControlName="note"></textarea>
        </label>
      }

      @if (errorMessage()) {
        <p class="modal-error" role="alert">{{ errorMessage() }}</p>
      }

      <footer>
        <button type="button" class="btn-secondary" (click)="cancelled.emit()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Aplicando…' : 'Aplicar alterações' }}
        </button>
      </footer>
    </form>
  </section>
</div>
